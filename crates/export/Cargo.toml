[package]
name = "export"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Render jobs for the Insta360 X5: decode -> stitch -> stabilise -> effects -> encode -> mux, 360 and flat, a queue; JPEG frame grabs"

[dependencies]
video.workspace = true
media.workspace = true
stitch.workspace = true
stab = { path = "../stab" }
# editor timelines (`Cut::Edit`) and their looks, adjustments and overlays: our own crates
edit.workspace = true
fx.workspace = true
wgpu.workspace = true
glam.workspace = true
pollster.workspace = true

[features]
# `synth`: a synthetic X5 recording (`synth::insv`), CPU only, for the tests of this crate and those above it
synth = []

[dev-dependencies]
# the tests' synthetic recording
export = { path = ".", features = ["synth"] }
