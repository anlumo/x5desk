[package]
name = "cam"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `sim`: a simulated X5 with a fake card behind link's simulated camera, for the tests of the code above this crate
sim = ["link/sim"]

[dependencies]
link.workspace = true
# a card's trailers (`disk`)
media.workspace = true
prost.workspace = true

# the local clock (`camera::clock`), CLOCK_MONOTONIC (`mono`), owner-only dirs (`dirs`), macOS's mount table (`disk`)
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# macOS, already in the tree through the app: App Nap held off while long work runs (`awake.rs`), the USB device a
# mounted disk sits on from the IOKit registry (`disk.rs`)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }

[dev-dependencies]
link = { workspace = true, features = ["sim"] }
