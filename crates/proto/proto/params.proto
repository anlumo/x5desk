// Interface messages for talking to the X5 camera over USB, Wi-Fi and Bluetooth, written for x5desk for
// interoperability: per-mode capture parameters by number, their reads and writes.
syntax = "proto3";

package cam;

message Params {
  sint32 ev                        = 7;
  Color color                      = 18;
  Exposure photo_exposure          = 20;
  Exposure video_exposure          = 21;
  uint32 iso_max                   = 24;
  Format format                    = 25;
  uint32 timer                     = 26;
  uint32 brackets                  = 27;
  uint32 duration                  = 29;
  Aspect aspect                    = 30;
  Resolution resolution            = 31;
  Fov fov                          = 33;
  uint32 speed                     = 37;
  uint32 white_balance             = 39;
  PhotoResolution photo_resolution = 40;
  uint32 time_left                 = 41;
  uint32 burst_count               = 44;
  uint32 burst_secs                = 51;
  LensExposure lens_exposure       = 61;
  bool hdr                         = 63;
  Horizon horizon                  = 70;
  bool low_light                   = 71;
  bool log                         = 72;
  PhotoHdr photo_hdr               = 77;
  uint32 p3                        = 86;

  message Exposure {
    Program program = 1;
    uint32 iso      = 2;
    double shutter  = 3;

    enum Program {
      PROGRAM_AUTO             = 0;
      PROGRAM_ISO_PRIORITY     = 1;
      PROGRAM_SHUTTER_PRIORITY = 2;
      PROGRAM_MANUAL           = 3;
      PROGRAM_ADAPTIVE         = 4;
      PROGRAM_FULL_AUTO        = 5;
    }
  }

  enum Horizon {
    HORIZON_OFF = 0;
  }

  enum PhotoHdr {
    PHOTO_HDR_OFF = 0;
    PHOTO_HDR_ON  = 1;
    PHOTO_HDR_AEB = 2;
  }

  enum LensExposure {
    LENS_EXPOSURE_OFF = 0;
  }
}

enum Param {
  PARAM_UNKNOWN          = 0;
  PARAM_EV               = 7;
  PARAM_COLOR            = 18;
  PARAM_PHOTO_EXPOSURE   = 20;
  PARAM_VIDEO_EXPOSURE   = 21;
  PARAM_ISO_MAX          = 24;
  PARAM_FORMAT           = 25;
  PARAM_TIMER            = 26;
  PARAM_BRACKETS         = 27;
  PARAM_DURATION         = 29;
  PARAM_ASPECT           = 30;
  PARAM_RESOLUTION       = 31;
  PARAM_FOV              = 33;
  PARAM_SPEED            = 37;
  PARAM_WHITE_BALANCE    = 39;
  PARAM_PHOTO_RESOLUTION = 40;
  PARAM_TIME_LEFT        = 41;
  PARAM_BURST_COUNT      = 44;
  PARAM_BURST_SECS       = 51;
  PARAM_LENS_EXPOSURE    = 61;
  PARAM_HDR              = 63;
  PARAM_HORIZON          = 70;
  PARAM_LOW_LIGHT        = 71;
  PARAM_LOG              = 72;
  PARAM_PHOTO_HDR        = 77;
  PARAM_P3               = 86;
}

enum Profile {
  PROFILE_DEFAULT             = 0;
  PROFILE_VIDEO_LIVE          = 1;
  PROFILE_VIDEO_TIMELAPSE     = 2;
  PROFILE_PHOTO_INTERVAL      = 3;
  PROFILE_VIDEO_BULLETTIME    = 4;
  PROFILE_PHOTO_BURST         = 5;
  PROFILE_PHOTO_SINGLE        = 6;
  PROFILE_VIDEO_NORMAL        = 7;
  PROFILE_PHOTO_HDR           = 8;
  PROFILE_VIDEO_HDR           = 9;
  PROFILE_VIDEO_TIMESHIFT     = 12;
  PROFILE_PHOTO_AEB_NIGHT     = 13;
  PROFILE_VIDEO_SUPER         = 16;
  PROFILE_VIDEO_LOOPRECORDING = 17;
  PROFILE_PHOTO_STARLAPSE     = 18;
  PROFILE_VIDEO_SELFIE        = 22;
  PROFILE_VIDEO_PURE          = 27;
  PROFILE_VIDEO_DASHCAM       = 63;
  PROFILE_VIDEO_GIMBAL        = 64;
}

message ReadParams {
  repeated Param keys = 1 [packed = false];
  Profile profile     = 2;
}

message ReadParamsReply {
  Params params = 2;
}

message WriteParams {
  repeated Param keys = 1 [packed = false];
  Params params       = 2;
  Profile profile     = 3;
}

message WriteParamsReply {}

