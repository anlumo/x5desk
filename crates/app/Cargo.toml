[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "x5desk"
path = "src/main.rs"

# macOS: x5desk.app and a disk image with it in target/release, `cargo packager --release` (cargo-packager 0.11:
# `cargo install cargo-packager --locked`; ARCHITECTURE.md, macOS). `macos.signing-identity` is the maintainer's Apple
# Development certificate, which runs on Macs of that team and keeps macOS's privacy grants across rebuilds (an ad hoc
# signature, "-", changes with every build); someone else puts their own there, or "-". A Developer ID Application
# identity plus Apple credentials in the environment (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, or APPLE_API_KEY,
# APPLE_API_ISSUER, APPLE_API_KEY_PATH) sign it for anyone and notarize it.
[package.metadata.packager]
product-name = "x5desk"
identifier = "io.github.anlumo.x5desk"
description = "Desktop app for the Insta360 X5: player, camera control, live output, export"
category = "Video"
binaries = [{ path = "x5desk", main = true }]
before-packaging-command = "cargo build --release --locked -p app"
formats = ["app", "dmg"]

[package.metadata.packager.macos]
# the face detector's Core ML package (crate track) targets macOS 15
minimum-system-version = "15.0"
info-plist-path = "macos/Info.plist"
signing-identity = "Apple Development: Andreas Monitzer (SEVVD2J45G)"

[dependencies]
proto.workspace = true
# `sim`: the simulated camera that replays a recorded live preview (the `replay=` hook, the capture tests)
link = { workspace = true, features = ["sim"] }
prost.workspace = true
media.workspace = true
video.workspace = true
stitch.workspace = true
stab = { path = "../stab" }
live.workspace = true
# the Export screen: render jobs, effects, the face privacy blur; the faces are found on frames of a clip that
# shotlab's `Clip` decodes and stitches; a job is a one-clip editor timeline
export.workspace = true
fx.workspace = true
track.workspace = true
edit.workspace = true
shotlab = { path = "../shotlab" }
bytemuck.workspace = true
glam.workspace = true
eframe.workspace = true
# egui 0.37 keeps the symbol fonts (★ ☆ ✔ in the camera screen) behind this feature
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
wgpu.workspace = true
pollster.workspace = true
rfd.workspace = true
libc.workspace = true
# the editor's preview mix plays on its own output stream (already in the tree through media)
cpal.workspace = true
# the Wireless pane; `sim`: the simulated adapter of the `ble=sim` hook and the pane's tests
ble = { workspace = true, features = ["sim"] }
# the Settings screen names the video queues' codec operations
ash.workspace = true

# macOS, already in the tree through wgpu, cubecl and eframe (winit has the versions before): App Nap held off while
# long work runs (`awake.rs`), the USB device a mounted disk sits on from the IOKit registry (`disk.rs`), the files
# Finder asks the app to open (`finder.rs`)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSProcessInfo", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }

[dev-dependencies]
# Already in the tree through eframe: the UI test runs its event loop off the main thread.
winit = { version = "0.30", default-features = false }
