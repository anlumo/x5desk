[package]
name = "track"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI tracking, framing, re-identification (LOMO), face privacy blur, highlights and library search for 360 video with open models (VitTrack, YOLOX, YuNet, TinyCLIP) on the shared wgpu device"

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
burn = { workspace = true, features = ["extension", "cubecl"] }
burn-store.workspace = true
burn-cubecl = { version = "0.22", default-features = false }
cubecl-runtime = { version = "0.11", default-features = false }
# owns the device's one burn attachment (`stitch::attach`), shared with RAFT
stitch.workspace = true
# highlights: the auto edit is an editor timeline; camera motion from stab's gyro track; audio from the file's AAC
edit.workspace = true
stab.workspace = true
media.workspace = true

# macOS: YuNet through Core ML on the Neural Engine (`coreml.rs`); objc2 as wgpu's Metal backend has it
[target.'cfg(target_os = "macos")'.dependencies]
# the compiled model's dir is checked to be this user's (geteuid)
libc.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLFeatureValue", "MLModel_MLModelCompilation", "MLMultiArrayConstraint", "block2"] }

[build-dependencies]
burn-onnx.workspace = true

[dev-dependencies]
pollster.workspace = true
