# The Linux binary for a release: x5desk-<version>-x86_64-linux.tar.gz with the app, README, LICENSE and the licence
# texts of what it bundles. A tag v<version> builds it and attaches it to a draft release of that tag (publish it on
# the Releases page); a manual run only builds it and keeps it as the run's artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # what the app is developed with
  RUST: 1.98.1
  # the workspace's release profile keeps line tables (a 1.1 GB binary); a download carries no debug info
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  linux:
    # glibc 2.39: the binary runs on distributions at least as new
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            [[ $GITHUB_REF_NAME == "v$v" ]] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $v"; exit 1; }
          else
            v=$v-$(git rev-parse --short HEAD)
          fi
          echo "DIR=x5desk-$v-x86_64-linux" >> "$GITHUB_ENV"

      # crate track's two TinyCLIP towers are in Git LFS; kept in a cache so that a run costs no LFS bandwidth
      - name: LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: LFS files
        run: git lfs pull

      - name: Disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev libasound2-dev libdbus-1-dev libpipewire-0.3-dev

      - name: Rust
        run: rustup toolchain install "$RUST" --profile minimal && rustup default "$RUST"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked -p app

      - name: Check
        run: |
          if ldd target/release/x5desk | grep "not found"; then exit 1; fi
          target/release/x5desk mcp --help > usage.txt
          grep -q "usage: x5desk mcp" usage.txt
          ls -l target/release/x5desk

      # The licence texts of the bundled models and of every crate the Linux binary links, as each crate ships
      # them; INDEX.txt lists them all with licence and source, also those whose package holds no licence file.
      - name: Package
        run: |
          mkdir -p "$DIR/licenses/models" "$DIR/licenses/crates"
          cp target/release/x5desk README.md LICENSE "$DIR/"
          cp crates/*/models/LICENSE-* crates/media/src/aacenc/NOTICE-vo-aacenc "$DIR/licenses/models/"
          python3 - "$DIR/licenses/crates" <<'EOF'
          import json, pathlib, shutil, subprocess, sys

          out = pathlib.Path(sys.argv[1])
          m = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--format-version", "1", "--filter-platform", "x86_64-unknown-linux-gnu"]))
          pk = {p["id"]: p for p in m["packages"]}
          deps = {n["id"]: n["deps"] for n in m["resolve"]["nodes"]}
          seen, todo = set(), [next(p["id"] for p in m["packages"] if p["name"] == "app" and p["source"] is None)]
          while todo:
              i = todo.pop()
              if i not in seen:
                  seen.add(i)
                  todo += [d["pkg"] for d in deps[i] if any(k["kind"] != "dev" for k in d["dep_kinds"])]
          rows = []
          for p in sorted((pk[i] for i in seen if pk[i]["source"]), key=lambda p: (p["name"], p["version"])):
              fs = [f for f in pathlib.Path(p["manifest_path"]).parent.iterdir() if f.is_file()
                    and f.name.upper().startswith(("LICENSE", "LICENCE", "COPYING", "COPYRIGHT", "NOTICE", "UNLICENSE"))]
              if fs:
                  d = out / f'{p["name"]}-{p["version"]}'
                  d.mkdir(parents=True)
                  for f in fs:
                      shutil.copy(f, d / f.name)
              rows.append(f'{p["name"]} {p["version"]} | {p["license"] or "see its files"} | {p["repository"] or ""} | {len(fs)} file(s)')
          (out / "INDEX.txt").write_text("\n".join(rows) + "\n")
          EOF
          tar -czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" | tee "$DIR.tar.gz.sha256"
          ls -l "$DIR.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIR }}
          path: |
            ${{ env.DIR }}.tar.gz
            ${{ env.DIR }}.tar.gz.sha256
          compression-level: 0

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DIR.tar.gz" "$DIR.tar.gz.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DIR.tar.gz" "$DIR.tar.gz.sha256" --draft --verify-tag \
              --title "x5desk $GITHUB_REF_NAME" \
              --notes "Linux x86-64 binary, built on Ubuntu 24.04 (glibc 2.39 or newer). Unpack it and run \`x5desk\`; requirements, the licence and the bundled models are in the README."
          fi
