# The Linux binary for a release: x5desk-<version>-x86_64-linux.tar.gz with the app, README, LICENSE and the licence
# texts of what it bundles. A tag v<version> builds it and attaches it to a draft release of that tag (publish it on
# the Releases page); a manual run only builds it and keeps it as the run's artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # what the app is developed with
  RUST: 1.98.1
  # the workspace's release profile keeps line tables (a 1.1 GB binary); a download carries no debug info
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            [[ $GITHUB_REF_NAME == "v$v" ]] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $v"; exit 1; }
          else
            v=$v-$(git rev-parse --short HEAD)
          fi
          echo "DIR=x5desk-$v-x86_64-linux" >> "$GITHUB_ENV"

      # crate track's two TinyCLIP towers are in Git LFS; kept in a cache so that a run costs no LFS bandwidth
      - name: LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: LFS files
        run: git lfs pull

      - name: Disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index
            ${{ runner.temp }}/cargo/registry/cache
            ${{ runner.temp }}/cargo/git/db
          key: cargo-${{ hashFiles('Cargo.lock') }}

      # in Debian 13, for its glibc and PipeWire (release-linux.sh)
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/cargo:/cargo" -e CARGO_HOME=/cargo \
            -e RUST -e DIR -e CARGO_TERM_COLOR -e CARGO_PROFILE_RELEASE_DEBUG -e CARGO_PROFILE_RELEASE_STRIP \
            debian:13 /src/.github/release-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIR }}
          path: |
            ${{ env.DIR }}.tar.gz
            ${{ env.DIR }}.tar.gz.sha256
          compression-level: 0

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DIR.tar.gz" "$DIR.tar.gz.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DIR.tar.gz" "$DIR.tar.gz.sha256" --draft --verify-tag \
              --title "x5desk $GITHUB_REF_NAME" \
              --notes "Linux x86-64 binary, built in Debian 13: it needs glibc 2.41 and PipeWire 1.2 or newer. Unpack it and run \`x5desk\`; requirements, the licence and the bundled models are in the README."
          fi
