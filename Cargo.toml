[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
proto = { path = "crates/proto" }
link = { path = "crates/link" }
media = { path = "crates/media" }
video = { path = "crates/video" }
stitch = { path = "crates/stitch" }
live = { path = "crates/live" }
stab = { path = "crates/stab" }
fx = { path = "crates/fx" }
edit = { path = "crates/edit" }
export = { path = "crates/export" }
track = { path = "crates/track" }
ble = { path = "crates/ble" }

wgpu = "30"
wgpu-hal = { version = "30", features = ["vulkan"] }
ash = "0.38"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
nusb = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
cpal = "0.18"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
zune-jpeg = "0.5"
libc = "0.2"
rfd = "0.17"
burn = { version = "0.22", default-features = false, features = ["std", "wgpu", "vulkan", "fusion", "autotune"] }
burn-store = "0.22"
burn-onnx = "0.22"

[profile.dev.package."*"]
opt-level = 2

# the denoiser and AAC encoder are too slow for real time at opt-level 0
[profile.dev.package.media]
opt-level = 2

[profile.release]
debug = 1
